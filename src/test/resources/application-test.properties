spring.application.name=PRODUCT-SERVICE-TEST

spring.datasource.url=jdbc:h2:mem:productsdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=false

jwt.secret=clave-secreta-de-prueba-con-longitud-suficiente
jwt.issuer=login-service
jwt.public=/actuator/health

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
